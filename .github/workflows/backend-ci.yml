name: Backend CI

on: 
    push:
    pull_request: 
      branches: 
        - main

jobs:
  # Runs the suite on Node 22 (older LTS) and 24 (local dev version) to catch
  # runtime-specific differences: a dependency or built-in API that behaves
  # differently, or a feature that exists in one Node major but not the other.
    test-matrix:
      name: backend-tests (node ${{ matrix.node-version }})
      runs-on: ubuntu-latest
      strategy:
        fail-fast: false
        matrix:
          node-version: [22, 24]
      defaults:
        run:
          working-directory: backend
      
      services: 
        postgres:
          image: postgres:16
          env:
            POSTGRES_USER: taskmanager
            POSTGRES_PASSWORD: taskmanager
            POSTGRES_DB: taskmanagerdb_test
          # GitHub maps the PostgreSQL container's port 5432 to the runner's localhost:5432.
          ports:
            - 5432:5432
          # Health checks: without it, tests can start before Postgres accepts
          # connections.
          options: >-
            --health-cmd "pg_isready -U taskmanager"
            --health-interval 5s
            --health-timeout 5s
            --health-retries 10

      # Job-level `env` so every step uses the test database.
      env:
        DATABASE_URL: "postgresql://taskmanager:taskmanager@localhost:5432/taskmanagerdb_test"
          
      steps:
        - name: Check out repository
          uses: actions/checkout@v5
        
        - name: Set up Node ${{ matrix.node-version }}
          uses: actions/setup-node@v5
          with: 
            node-version: ${{ matrix.node-version}}
            cache: npm
            cache-dependency-path: backend/package-lock.json

        - name: Install dependencies
          run: npm ci
        
        - name: Generate Prisma Client
          run: npx prisma generate
        
        - name: Apply migrations
          run: npx prisma migrate deploy
        
        - name: Typecheck
          run: npm run typecheck
        
        - name: Run tests
          run: npm run test

    backend-tests:
        name: backend-tests
        needs: test-matrix
        if: always()
        runs-on: ubuntu-latest
        steps:
          - name: Fail if any matrix leg failed
            run: |
                if [ "${{ needs.test-matrix.result }}" != "success" ]; then
                  echo "Matrix result: ${{ needs.test-matrix.result }}"
                  exit 1
                fi

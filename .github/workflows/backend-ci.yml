name: Backend CI

on: 
    push:
    pull_request: 
      branches: 
        - main

jobs:
  # Runs the suite on Node 22 (older LTS) and 24 (local dev version) to catch
  # runtime-specific differences: a dependency or built-in API that behaves
  # differently, or a feature that exists in one Node major but not the other.
    test-matrix:
      name: backend-tests (node ${{ matrix.node-version }}
      runs-on: ubuntu-latest
      strategy:
        fail-fast: false
        matrix:
          node-version: [20, 24]
      defaults:
        run:
          working-directory: backend
          
      steps:
        - name: Check out repository
          uses: actions/checkout@v5
        
        - name: Set up Node ${{ matrix.node-version }}
          uses: actions/setup-node@v5
          with: 
            node-version: ${{ matrix.node-version}}
            cache: npm
            cache-dependency-path: backend/package-lock.json

        - name: Install dependencies
          run: npm ci
        
        - name: Generate Prisma Client
          run: npx prisma generate
          env:
            DATABASE_URL: postgresql://user:password@localhost:5432/placeholder
        
        - name: Typecheck
          run: npm run typecheck
        
        - name: Run tests
          run: npm run test

    backend-tests:
        name: backend-tests
        needs: test-matrix
        if: always()
        runs-on: ubuntu-latest
        steps:
          - name: Fail if any matrix leg failed
            run: |
                if [ "${{ needs.test-matrix.result }}" != "success" ]; then
                  echo "Matrix result: ${{ needs.test-matrix.result }}"
                  exit 1
                fi
name: Deploy demo

on:
    # Start by hand from the Github Actions tab and pick blue or green.
    # "Deploy" half of deploy-vs-release.
    workflow_dispatch: 
        inputs:
            slot:
                description: "Which prefix to deploy to"
                required: true
                type: choice
                options:
                    - blue
                    - green

# The job only reads the repo, so it get the 
# minimum Github token permissions.
permissions: 
    contents: read

jobs:
    deploy:
        name: deploy to ${{ inputs.slot }}
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: deploy-demo

        steps:
            - name: Check out repository
              uses: actions/checkout@v5

            - name: Set up Node
              uses: actions/setup-node@v5
              with:
                node-version: 24
                cache: npm
                cache-dependency-path: deploy-demo/package-lock.json
            
            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build
              env:
                VITE_DEPLOY_SLOT: ${{ inputs.slot }}

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                # Credentials store in Github Secrets and Variables.
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
                aws-region: ${{ vars.AWS_REGION}}
            
            # `aws s3 sync ... --delete`: uploads only what changed and removes stale files
            # under that one prefix. The `--delete` stays safe because it's scoped to `blue/` or `green/`, never the bucket root, so it can't touch `live.json`.
            - name: Upload to S3
              run: aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/${{ inputs.slot }}" --delete
